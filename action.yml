name: 'Repo Scan Action'
description: 'Scans repositories for vulnerabilities using custom script'
author: 'fm-labs'

inputs:
  path:
    description: 'A path within the source code repo.'
    required: false
    default: '.'
  debug:
    description: 'Enable debug mode'
    required: false
    default: 'false'

outputs:
  scan-file:
    description: Path (relative to workspace) of the JSON scan result
  scan-output:
    description: Raw scan output
  exit-code:
    description: Exit code of the scan

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.path }}

branding:
  icon: 'shield'
  color: 'blue'